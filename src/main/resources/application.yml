spring:
  application:
    name: agentic-url-shortener
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: http://localhost:8080
  code-length: 8
