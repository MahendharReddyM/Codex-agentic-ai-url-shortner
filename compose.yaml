services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: local-postgres-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ANALYTICS_SALT: change-this-demo-secret
      AGENTIC_PERSISTENCE: postgresql
      AGENTIC_JDBC_URL: jdbc:postgresql://postgres:5432/agentic
      AGENTIC_JDBC_USER: agentic
      AGENTIC_JDBC_PASSWORD: local-postgres-only
      AGENTIC_REPOSITORY_ROOT: /repository
      AGENTIC_WORKSPACE_ROOT: /work/engineering-runs
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /work:mode=1777
    volumes:
      - .:/repository:ro
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:

